<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      property="description"
      content="The solution to The Odin Project challenge: Restaurant Page"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />

    <title>oDine</title>
  </head>
  <body>
    <main id="content"></main>
    <footer>
      <div class="info-wrapper">
        <div class="logo">oDine</div>
        <div class="restaurant-info">
          <div class="address">
            <p>Marthwaite, Sedbergh</p>
            <p>Cumbria</p>
            <p>+00 44 123 4567</p>
          </div>
          <div class="times">
            <h3>OPEN TIMES</h3>
            <p>MON - FRI: 09:00 AM - 10:00 PM</p>
            <p>SAT - SUN: 09:00 AM - 11:30 PM</p>
          </div>
        </div>
      </div>
      <div class="attribution">
        <p>
          Project by
          <a
            href="https://www.theodinproject.com/lessons/node-path-javascript-restaurant-page"
            >The Odin Project</a
          >. Design by
          <a
            href="https://www.frontendmentor.io/challenges/dine-restaurant-website-yAt7Vvxt7"
            >Frontend Mentor</a
          >.
        </p>
        <p>
          Photos courtesy of
          <a href="https://unsplash.com/@orkunorcan">Orkun Orcan</a>. Coded by
          <a
            href="https://github.com/sydalwedaie/odin-project-restaurant/tree/main"
            >Sayed Ali Alwedaie</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>
